<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://use.typekit.net/gaz7bkg.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css">
  <title>Mensagens · BeaCreative</title>
</head>
<body>
  <div id="carregando" class="carregando">Carregando…</div>

  <div id="app" hidden>
    <header class="topo">
      <a class="titulo titulo-link" href="/admin/">BeaCreative</a>
      <button id="sair" class="botao-link" type="button">Sair</button>
    </header>

    <main class="conteudo-pagina">
      <a class="voltar" href="/admin/">Todos os clientes</a>

      <div class="cabecalho-secao">
        <div>
          <h1>Mensagens</h1>
          <p id="resumo" class="subtitulo"></p>
        </div>
        <button id="ativar-notificacoes" class="botao-secundario" type="button" hidden>Avisar no navegador</button>
      </div>
      <p id="notificacoes-info" class="dica" hidden></p>

      <p id="caixa-vazia" class="vazio" hidden>
        Nenhuma conversa ainda. Quando um cliente escrever, aprovar ou pedir ajuste, aparece aqui.
      </p>
      <ol id="caixa" class="caixa"></ol>
    </main>
  </div>

  <template id="modelo-conversa">
    <li class="caixa-item">
      <a class="caixa-link">
        <span class="caixa-topo">
          <span class="caixa-cliente"></span>
          <span class="caixa-quando"></span>
        </span>
        <span class="caixa-titulo"></span>
        <span class="caixa-rodape">
          <span class="caixa-previa"></span>
          <span class="nao-lidas" hidden></span>
        </span>
      </a>
    </li>
  </template>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/assets/js/admin-mensagens.js"></script>
</body>
</html>
