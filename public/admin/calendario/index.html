<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#FFF5E9">
  <link rel="stylesheet" href="https://use.typekit.net/gaz7bkg.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css">
  <title>Calendário · BeaCreative</title>
</head>
<body>
  <div id="carregando" class="carregando" role="status"><img class="marca-monograma" src="/assets/img/monograma.png" alt="" width="205" height="256"><span class="carregando-texto">Carregando…</span></div>

  <div id="app" hidden>
    <header class="topo">
      <a class="titulo titulo-link" href="/admin/"><img class="logo" src="/assets/img/logo-beacreative.svg" alt="BeaCreative" width="883" height="153"></a>
      <button id="sair" class="botao-link" type="button">Sair</button>
    </header>

    <main class="conteudo-pagina calendario-pagina">
      <div class="cabecalho-secao">
        <h1>Calendário</h1>
        <div class="cal-mes" role="group" aria-label="Mês">
          <button id="mes-anterior" class="cal-seta" type="button" aria-label="Mês anterior">‹</button>
          <p id="mes-nome" class="cal-mes-nome" aria-live="polite"></p>
          <button id="mes-seguinte" class="cal-seta" type="button" aria-label="Próximo mês">›</button>
          <button id="mes-hoje" class="botao-link cal-hoje" type="button">Hoje</button>
        </div>
      </div>

      <!-- Entregas do mês por cliente; tocar num cliente filtra o calendário. -->
      <section class="cal-resumo" aria-labelledby="titulo-resumo">
        <h2 id="titulo-resumo" class="so-leitor">Entregas do mês por cliente</h2>
        <p id="resumo-total" class="subtitulo"></p>
        <ul id="resumo-clientes" class="cal-clientes"></ul>
      </section>

      <div id="cal-vazio" class="vazio" hidden>
        <img class="marca-monograma" src="/assets/img/monograma.png" alt="" width="205" height="256">
        <p>Nenhuma entrega com data neste mês.</p>
      </div>

      <!-- Computador: grade do mês. Celular: lista por dia (só os dias com entrega). -->
      <div id="grade" class="cal-grade" role="table" aria-label="Entregas do mês"></div>
      <ol id="lista-dias" class="cal-dias"></ol>

      <section id="sem-data" class="cal-sem-data" aria-labelledby="titulo-sem-data" hidden>
        <h2 id="titulo-sem-data">Sem data</h2>
        <p class="subtitulo">Conteúdos que ainda não têm data de publicação.</p>
        <ul id="lista-sem-data" class="cal-itens"></ul>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/assets/js/admin-calendario.js"></script>
</body>
</html>
