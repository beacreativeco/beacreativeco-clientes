  <title>Entrar · BeaCreative</title>

<body>
  <main class="pagina-central">
    <section class="cartao">
      <header class="marca">
        <h1><img class="logo" src="/assets/img/logo-beacreative.svg" alt="BeaCreative" width="883" height="153"></h1>
        <p>Os conteúdos da sua marca, prontos para o seu ok.</p>
      </header>

      <div id="aviso" class="aviso" role="alert" hidden></div>

      <form id="form-login" novalidate>
        <div class="campo">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="current-password" required>
        </div>
        <button class="botao" type="submit">Entrar</button>
      </form>

      <div class="entrar-google">
        <p class="separador-ou"><span>ou</span></p>
        <button id="google" class="botao-google" type="button">
          <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true" focusable="false"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Entrar com o Google
        </button>
      </div>

      <div class="acoes-secundarias">
        <button id="esqueci" class="botao-link" type="button">Esqueci minha senha</button>
      </div>
    </section>

      <span aria-hidden="true">Victor Carvalho</span>
    </a>
  </main>

  <script type="module">
    import { supabase } from '/assets/js/supabase.js';
    import { entrar, entrarComGoogle, erroDoGoogle, pedirNovaSenha, carregarPerfil, decidirDestino } from '/assets/js/auth.js';

    const form = document.getElementById('form-login');
    const aviso = document.getElementById('aviso');
    const botao = form.querySelector('button[type=submit]');

    function mostrar(texto, tipo = 'erro') {
      aviso.textContent = texto;
      aviso.className = 'aviso ' + tipo;
      aviso.hidden = false;
    }

    // Volta do Google com erro (ex.: conta sem acesso): explica e limpa a URL.
    const erroGoogle = erroDoGoogle();
    if (erroGoogle) {
      mostrar(erroGoogle);
      history.replaceState(null, '', location.pathname);
    }

    // Já logado (inclusive voltando do Google)? Vai direto pra área certa.
    // Acesso suspenso: sai e explica. Se falhar, só fica na tela de login normalmente.
    try {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        const destino = decidirDestino(await carregarPerfil(session.user.id));
        if (destino.rota) window.location.replace(destino.rota);
        else {
          await supabase.auth.signOut();
          mostrar(destino.erro);
        }
      }
    } catch (err) {
      console.error(err);
    }

    document.getElementById('google').addEventListener('click', async (e) => {
      aviso.hidden = true;
      e.currentTarget.disabled = true;
      try {
        await entrarComGoogle(); // sai da página para o Google
      } catch (err) {
        mostrar(err.message);
        e.currentTarget.disabled = false;
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      aviso.hidden = true;
      const email = form.email.value.trim();
      const senha = form.senha.value;
      if (!email || !senha) return mostrar('Preencha e-mail e senha.');

      botao.disabled = true;
      try {
        window.location.replace(await entrar(email, senha));
      } catch (err) {
        mostrar(err.message);
        botao.disabled = false;
      }
    });

    document.getElementById('esqueci').addEventListener('click', async () => {
      const email = form.email.value.trim();
      if (!email) return mostrar('Digite seu e-mail acima e clique de novo.');
      try {
        await pedirNovaSenha(email);
        mostrar('Se esse e-mail estiver cadastrado, você vai receber um link para criar uma nova senha.', 'ok');
      } catch (err) {
        mostrar(err.message);
      }
    });
  </script>
</body>
</html>
