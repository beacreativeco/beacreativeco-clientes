<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#2B201B">
  <link rel="stylesheet" href="https://use.typekit.net/gaz7bkg.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="/assets/js/tema.js"></script>
  <script type="module" src="/assets/js/erros.js"></script>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <title>Definir senha · BeaCreative</title>
</head>
<body>
  <main class="pagina-central">
    <section class="cartao">
      <header class="marca">
        <h1><img class="logo" src="/assets/img/logo-beacreative.svg" alt="BeaCreative" width="883" height="153"></h1>
        <p>Crie sua senha para acompanhar e aprovar seus conteúdos.</p>
      </header>

      <div id="aviso" class="aviso" role="alert" hidden></div>

      <form id="form-senha" novalidate hidden>
        <div class="campo">
          <label for="senha">Nova senha</label>
          <input id="senha" name="senha" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="campo">
          <label for="confirmacao">Repita a senha</label>
          <input id="confirmacao" name="confirmacao" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <button class="botao" type="submit">Salvar e entrar</button>
      </form>

      <div class="acoes-secundarias">
        <a href="/">Voltar para o login</a>
      </div>
    </section>
  </main>

  <script type="module" src="/assets/js/definir-senha.js"></script>
</body>
</html>
