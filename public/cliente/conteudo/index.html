<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#2B201B">
  <link rel="stylesheet" href="https://use.typekit.net/gaz7bkg.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="/assets/js/tema.js"></script>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/previa.css">
  <title>Conteúdo · BeaCreative</title>
</head>
<body class="pagina-tela-conteudo">
  <header class="topo">
    <a class="titulo titulo-link" href="/cliente/"><img class="logo" src="/assets/img/logo-beacreative.svg" alt="BeaCreative" width="883" height="153"></a>
    <button id="sair" class="botao-link" type="button">Sair</button>
  </header>

  <div id="carregando" class="carregando" role="status">
    <span class="so-leitor">Carregando…</span>
    <div class="esqueleto esqueleto-editor" aria-hidden="true"><div class="esq-grade-editor"><div class="esq-coluna"><span class="esq esq-linha mini"></span><span class="esq esq-titulo"></span><span class="esq esq-bloco"></span><span class="esq esq-campo"></span><span class="esq esq-campo"></span><span class="esq esq-campo"></span></div><div class="esq-coluna"><span class="esq esq-previa"></span></div></div></div>
  </div>

  <div id="app" hidden>
    <main class="conteudo-pagina tela-conteudo tc-cliente" data-aba="previa">
      <!-- Computador: prévia e conversa lado a lado. Celular: uma página só, a conversa
           embaixo da prévia e a decisão presa no pé (tela-conteudo.js). -->
      <div class="tc-grade">
        <div class="tc-parte-previa">
          <nav id="trilha" class="trilha" aria-label="Você está aqui" hidden></nav>

          <div class="cc-cabecalho">
            <h1 id="titulo"></h1>
            <p id="situacao" class="situacao"></p>
            <p id="detalhes" class="subtitulo"></p>
          </div>

          <p id="prazo" class="cc-prazo" hidden></p>

          <div id="previa" class="cc-previa"></div>

          <a id="drive" class="cc-drive" target="_blank" rel="noopener" hidden>Ver os arquivos originais no Drive</a>

          <div id="aviso" class="aviso erro" role="alert" hidden></div>

          <p id="resultado" class="cc-resultado" hidden></p>

          <section id="decisao" class="cc-decisao" aria-label="Sua decisão" hidden>
            <div class="cc-decisao-botoes">
              <button id="aprovar" class="botao cc-aprovar" type="button">✦ Aprovado</button>
              <button id="abrir-ajuste" class="botao-secundario" type="button">Pedir ajuste</button>
            </div>
          </section>
        </div>

        <section class="tc-parte-conversa" aria-label="Conversa com a Bea sobre este conteúdo">
          <header class="tc-conversa-cab">
            <span id="conversa-foto" class="conversa-foto" aria-hidden="true"></span>
            <span class="tc-conversa-quem"><strong id="conversa-nome">Bea</strong><span>Conversa sobre este conteúdo</span></span>
            <a class="botao-link" href="/cliente/mensagens/">Todas as mensagens</a>
          </header>
          <div class="tc-conversa-corpo"></div>
        </section>
      </div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/assets/js/cliente-conteudo.js"></script>
</body>
</html>
