<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#FFF5E9">
  <link rel="stylesheet" href="https://use.typekit.net/gaz7bkg.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css">
  <title>Seus conteúdos · BeaCreative</title>
</head>
<body>
  <div id="carregando" class="carregando" role="status"><img class="marca-monograma" src="/assets/img/monograma.png" alt="" width="205" height="256"><span class="carregando-texto">Carregando…</span></div>

  <div id="app" hidden>
    <header class="topo">
      <span class="titulo"><img class="logo" src="/assets/img/logo-beacreative.svg" alt="BeaCreative" width="883" height="153"></span>
      <button id="sair" class="botao-link" type="button">Sair</button>
    </header>

    <main class="conteudo-pagina cliente-pagina">
      <div class="cliente-boas-vindas">
        <h1 id="saudacao">Olá</h1>
        <p id="resumo" class="subtitulo"></p>
      </div>

      <div id="lista-vazia" class="vazio" hidden>
        <img class="marca-monograma" src="/assets/img/monograma.png" alt="" width="205" height="256">
        <p>Ainda não tem conteúdo por aqui. Quando a Bea enviar o primeiro para você aprovar, ele aparece nesta página.</p>
      </div>

      <section id="secao-aprovar" class="cliente-grupo" aria-labelledby="titulo-aprovar" hidden>
        <h2 id="titulo-aprovar">Esperando você</h2>
        <ol class="agenda" data-grupo="em_aprovacao"></ol>
      </section>

      <section id="secao-ajuste" class="cliente-grupo" aria-labelledby="titulo-ajuste" hidden>
        <h2 id="titulo-ajuste">Em ajuste com a Bea</h2>
        <ol class="agenda" data-grupo="ajuste_solicitado"></ol>
      </section>

      <section id="secao-aprovados" class="cliente-grupo" aria-labelledby="titulo-aprovados" hidden>
        <h2 id="titulo-aprovados">Aprovados</h2>
        <ol class="agenda" data-grupo="aprovado"></ol>
      </section>
    </main>
  </div>

  <template id="modelo-conteudo">
    <li class="agenda-item">
      <a class="agenda-link">
        <span class="agenda-data">
          <span class="agenda-dia"></span>
          <span class="agenda-mes"></span>
        </span>
        <span class="agenda-info">
          <span class="agenda-titulo"></span>
          <span class="nao-lidas" hidden></span>
          <span class="agenda-formato"></span>
        </span>
        <span class="situacao"></span>
      </a>
    </li>
  </template>

  <script type="module" src="/assets/js/cliente-lista.js"></script>
</body>
</html>
