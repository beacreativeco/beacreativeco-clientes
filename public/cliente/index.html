<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://use.typekit.net/gaz7bkg.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css">
  <title>Seus conteúdos · BeaCreative</title>
</head>
<body>
  <div id="carregando" class="carregando">Carregando…</div>

  <div id="app" hidden>
    <header class="topo">
      <span class="titulo">BeaCreative</span>
      <button id="sair" class="botao-link" type="button">Sair</button>
    </header>
    <main class="conteudo-pagina">
      <h2 id="saudacao">Seus conteúdos</h2>
      <!-- Próxima etapa: lista de conteúdos com preview estilo Instagram -->
    </main>
  </div>

  <script type="module">
    import { sair } from '/assets/js/auth.js';
    import { iniciarPagina } from '/assets/js/ui.js';

    iniciarPagina('cliente', ({ perfil }) => {
      document.getElementById('saudacao').textContent = 'Olá, ' + perfil.cliente.nome;
      document.getElementById('sair').addEventListener('click', sair);
    });
  </script>
</body>
</html>
