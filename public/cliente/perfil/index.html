<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#2B201B">
  <link rel="stylesheet" href="https://use.typekit.net/gaz7bkg.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="/assets/js/tema.js"></script>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <title>Meu perfil · BeaCreative</title>
</head>
<body>
  <header class="topo">
    <a class="titulo titulo-link" href="/cliente/"><img class="logo" src="/assets/img/logo-beacreative.svg" alt="BeaCreative" width="883" height="153"></a>
    <button id="sair" class="botao-link" type="button">Sair</button>
  </header>

  <div id="carregando" class="carregando" role="status">
    <span class="so-leitor">Carregando…</span>
    <div class="esqueleto esqueleto-perfil" aria-hidden="true"><div class="esq-cabecalho"><span class="esq esq-titulo"></span></div><span class="esq esq-cartao"></span><span class="esq esq-cartao"></span></div>
  </div>

  <div id="app" hidden>
    <main class="conteudo-pagina perfil-pagina">
      <h1>Meu perfil</h1>

      <!-- Foto e nome de quem aprova: a Bea vê nos balões da conversa.
           A foto e o @ da prévia dos posts são os que a Bea cadastrou (não mudam aqui). -->
      <section class="perfil-secao" aria-labelledby="t-voce">
        <h2 id="t-voce">Você</h2>
        <div class="perfil-foto">
          <span id="avatar" class="avatar avatar-perfil"></span>
          <div class="perfil-foto-acoes">
            <label class="botao-secundario" for="foto">Trocar foto</label>
            <input id="foto" type="file" accept="image/*" class="visualmente-oculto">
            <button id="remover-foto" class="botao-link" type="button" hidden>Remover foto</button>
          </div>
        </div>
        <form id="form-nome" novalidate>
          <div class="campo">
            <label for="nome">Seu nome</label>
            <input id="nome" name="nome" type="text" autocomplete="name" maxlength="80">
            <small class="dica">A Bea vê seu nome e sua foto (ou a logo) nas mensagens. A foto e o @ da prévia dos posts continuam os que ela cadastrou.</small>
          </div>
          <button class="botao botao-compacto" type="submit">Salvar nome</button>
        </form>
      </section>

      <section class="perfil-secao" aria-labelledby="t-email">
        <h2 id="t-email">E-mail de acesso</h2>
        <p class="perfil-atual"><strong id="email-atual"></strong></p>
        <p class="dica">Para trocar o e-mail, fale com a Bea.</p>
      </section>

      <section class="perfil-secao" aria-labelledby="t-senha">
        <h2 id="t-senha">Senha</h2>
        <form id="form-senha" novalidate>
          <div class="campo">
            <label for="senha-atual">Senha atual</label>
            <input id="senha-atual" name="atual" type="password" autocomplete="current-password">
            <button id="esqueci-senha" class="botao-link dica-link" type="button">Esqueci a senha atual</button>
          </div>
          <div class="campo">
            <label for="senha-nova">Nova senha</label>
            <input id="senha-nova" name="nova" type="password" autocomplete="new-password" minlength="8">
            <small class="dica">Pelo menos 8 caracteres.</small>
          </div>
          <div class="campo">
            <label for="senha-confirma">Repita a nova senha</label>
            <input id="senha-confirma" name="confirma" type="password" autocomplete="new-password">
          </div>
          <button class="botao botao-compacto" type="submit">Trocar senha</button>
        </form>
      </section>

      <section class="perfil-secao" aria-labelledby="t-notificacoes">
        <h2 id="t-notificacoes">Notificações</h2>
        <div id="secao-notificacoes" class="notificacoes"></div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/assets/js/cliente-perfil.js"></script>
</body>
</html>
